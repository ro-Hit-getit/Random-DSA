name: Update Problem Catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update catalog
        run: python update_catalog.py

      - name: Check changes
        run: git status --short

      - name: Commit updated catalog
        run: |
          git config user.name "Problem Forge Bot"
          git config user.email "actions@github.com"

          git add data.json meta.json

          if git diff --cached --quiet; then
            echo "No catalog changes."
          else
            git commit -m "Update problem catalog"
            git push
          fi
